version: "3.8"

services:
  traefik:
    image: traefik:v2.11
    command:
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=admin@niksusername.com
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    networks:
      - public

  acme-dummy:
    image: traefik/whoami:latest
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.acme-dummy.rule=Host(`mail.niksusername.com`)"
        - "traefik.http.routers.acme-dummy.entrypoints=websecure"
        - "traefik.http.routers.acme-dummy.tls=true"
        - "traefik.http.routers.acme-dummy.tls.certresolver=letsencrypt"
        - "traefik.http.services.acme-dummy.loadbalancer.server.port=80"
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    networks:
      - public

networks:
  public:
    external: true

volumes:
  traefik_acme:
    external: true
